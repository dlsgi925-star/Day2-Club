<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>순간포착 신입 부원 모집</title>
  <style>
    :root {
      --bg: #101114;
      --panel: #1a1c21;
      --text: #ecebe6;
      --muted: #9a9ca4;
      --line: #2c2f37;
      --accent: #f5c542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      word-break: keep-all;
    }

    /* 맨 위: 지원하기 + D-day */
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 72px;
      text-align: center;
    }
    #apply-top {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 20px;
      padding: 18px 24px;
      background: var(--accent);
      color: #1a1405;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 6px 24px rgba(245, 197, 66, .25);
    }
    #apply-top:active { transform: scale(.98); }
    header p { margin: 0; color: var(--muted); font-size: .95rem; }
    #dday {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 800;
    }
    #dday:empty { display: none; }
    header h1 {
      margin: 72px 0 8px;
      font-size: 2.6rem;
      font-weight: 300;
      letter-spacing: .3em;
      padding-left: .3em;
    }
    header h1 + p { font-size: 1.05rem; color: var(--text); opacity: .75; }

    /* 본문: 갤러리처럼 넉넉한 여백 */
    main { max-width: 720px; margin: 0 auto; padding: 0 24px 96px; }
    section { margin-bottom: 88px; }
    h2 {
      margin: 0 0 24px;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .25em;
      color: var(--accent);
    }
    section ul { list-style: none; margin: 0; padding: 0; }
    section li {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    section li:last-child { border-bottom: 1px solid var(--line); }

    /* 활동 사진: 회색 박스 6개 격자 */
    .photos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .photo {
      aspect-ratio: 4 / 3;
      background: #55575d;
      border-radius: 4px;
    }
    @media (min-width: 600px) {
      .photos { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    /* 선배 후기 */
    blockquote {
      margin: 0;
      padding: 8px 0 8px 20px;
      border-left: 3px solid var(--accent);
    }
    blockquote p { margin: 0 0 12px; font-size: 1.3rem; line-height: 1.6; }
    blockquote footer { color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <header id="top">
    <a id="apply-top" href="#">지원하기</a>
    <p>마감: 2026년 11월 28일 23:59 <span id="dday"></span></p>
    <h1>순간포착</h1>
    <p>사진 동아리 신입 부원 모집 · 모집 인원 10명</p>
  </header>

  <main>
    <section id="activity">
      <h2>활동</h2>
      <ul>
        <li>매주 화요일 저녁 정기 촬영 모임</li>
        <li>학기말 전시회</li>
      </ul>
    </section>

    <section id="gallery">
      <h2>활동 사진</h2>
      <div class="photos">
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
      </div>
    </section>

    <section id="requirements">
      <h2>지원 조건</h2>
      <ul>
        <li>개인 카메라 (폰 카메라도 가능)</li>
        <li>초보자 환영</li>
      </ul>
    </section>

    <section id="review">
      <h2>선배 후기</h2>
      <blockquote>
        <p>"카메라 없이 들어왔는데 지금은 전시회까지 열어요"</p>
        <footer>- 3학년 이지수</footer>
      </blockquote>
    </section>

    <section id="how-to-apply">
      <h2>지원 방법</h2>
      <ul>
        <li>구글폼으로 지원</li>
        <li>마감: 2026년 11월 28일 23:59</li>
      </ul>
    </section>
  </main>

  <script>
    // 마감: 2026년 11월 28일 23:59 (월은 0부터 시작하므로 10 = 11월)
    var DEADLINE = new Date(2026, 10, 28, 23, 59, 0);

    // now 기준으로 D-day 문구를 돌려줌
    function getDdayText(now) {
      if (now > DEADLINE) return '모집 마감';
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var deadlineDay = new Date(DEADLINE.getFullYear(), DEADLINE.getMonth(), DEADLINE.getDate());
      var diff = Math.round((deadlineDay - today) / 86400000);
      return diff === 0 ? 'D-day' : 'D-' + diff;
    }

    document.getElementById('dday').textContent = getDdayText(new Date());
  </script>
</body>
</html>
