<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>순간포착 신입 부원 모집</title>
</head>
<body>
  <header id="top">
    <a id="apply-top" href="#">지원하기</a>
    <p>마감: 2026년 11월 28일 23:59 <span id="dday"></span></p>
    <h1>순간포착</h1>
    <p>사진 동아리 신입 부원 모집 · 모집 인원 10명</p>
  </header>

  <main>
    <section id="activity">
      <h2>활동</h2>
      <ul>
        <li>매주 화요일 저녁 정기 촬영 모임</li>
        <li>학기말 전시회</li>
      </ul>
    </section>

    <section id="gallery">
      <h2>활동 사진</h2>
      <div class="photos">
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
        <div class="photo"></div>
      </div>
    </section>

    <section id="requirements">
      <h2>지원 조건</h2>
      <ul>
        <li>개인 카메라 (폰 카메라도 가능)</li>
        <li>초보자 환영</li>
      </ul>
    </section>

    <section id="review">
      <h2>선배 후기</h2>
      <blockquote>
        <p>"카메라 없이 들어왔는데 지금은 전시회까지 열어요"</p>
        <footer>- 3학년 이지수</footer>
      </blockquote>
    </section>

    <section id="how-to-apply">
      <h2>지원 방법</h2>
      <ul>
        <li>구글폼으로 지원</li>
        <li>마감: 2026년 11월 28일 23:59</li>
      </ul>
    </section>
  </main>

  <script>
    // 마감: 2026년 11월 28일 23:59 (월은 0부터 시작하므로 10 = 11월)
    var DEADLINE = new Date(2026, 10, 28, 23, 59, 0);

    // now 기준으로 D-day 문구를 돌려줌
    function getDdayText(now) {
      if (now > DEADLINE) return '모집 마감';
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var deadlineDay = new Date(DEADLINE.getFullYear(), DEADLINE.getMonth(), DEADLINE.getDate());
      var diff = Math.round((deadlineDay - today) / 86400000);
      return diff === 0 ? 'D-day' : 'D-' + diff;
    }

    document.getElementById('dday').textContent = getDdayText(new Date());
  </script>
</body>
</html>
